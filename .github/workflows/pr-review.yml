name: Trigger AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'

# Ensure the workflow has write permissions to post reviews and comments to the PR
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: Autonomous Code Review
    # Call the reusable workflow from your central bot repo:
    # -----------------------------------------------------------------------------------------
    # (Remote Central Repo): Replace with your actual org/repo and path:
    uses: RohitKeshavala/PR_Review_Bot/.github/workflows/reusable-pr-review.yml@updated-bot
    # -----------------------------------------------------------------------------------------
    with:
      target-path: 'frontend'              # Only analyze frontend code
      fail-on-changes: false              # Set to true if you want CI to fail on CHANGES_REQUESTED
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
